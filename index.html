<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>研发供应商资源平台 · 原型 v1</title>
<style>
:root{
  --bg:#f5f7fa; --panel:#fff; --bd:#e3e8ef; --bd2:#eef2f7;
  --tx:#0f172a; --tx2:#475569; --mut:#94a3b8;
  --pri:#1e5eff; --pri-l:#eaf1ff;
  --ok:#0d9488; --ok-l:#e6f7f5;
  --wn:#d97706; --wn-l:#fef6e7;
  --er:#dc2626; --er-l:#feecec;
  --gr:#64748b; --gr-l:#f1f5f9;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft YaHei","PingFang SC",-apple-system,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.6}
.app{display:flex;min-height:100vh}
/* 侧栏 */
.sb{width:216px;background:#0f172a;color:#cbd5e1;flex:0 0 216px;display:flex;flex-direction:column;position:fixed;height:100vh;z-index:20}
.sb-h{padding:18px 18px 14px;border-bottom:1px solid #1e293b}
.sb-h h1{font-size:15px;color:#fff;font-weight:600;letter-spacing:.5px}
.sb-h span{font-size:10px;color:#64748b;letter-spacing:.3px}
.sb nav{padding:10px 8px;flex:1}
.sb nav a{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:7px;cursor:pointer;
  color:#cbd5e1;font-size:13px;margin-bottom:2px;transition:.15s}
.sb nav a:hover{background:#1e293b;color:#fff}
.sb nav a.on{background:var(--pri);color:#fff;font-weight:500}
.sb nav a b{margin-left:auto;background:#334155;color:#cbd5e1;border-radius:9px;padding:0 7px;font-size:11px;font-weight:500}
.sb nav a.on b{background:rgba(255,255,255,.22);color:#fff}
.sb nav a i{font-style:normal;width:16px;text-align:center;opacity:.85}
.sb-f{padding:12px 16px;border-top:1px solid #1e293b;font-size:11px;color:#64748b;line-height:1.7}
.sb-f b{color:#94a3b8;font-weight:500}
/* 主区 */
.mn{flex:1;margin-left:216px;display:flex;flex-direction:column}
.tb{height:56px;background:var(--panel);border-bottom:1px solid var(--bd);display:flex;align-items:center;
  padding:0 22px;position:sticky;top:0;z-index:10}
.tb h2{font-size:16px;font-weight:600}
.tb .crumb{font-size:12px;color:var(--mut);margin-left:10px;padding-left:10px;border-left:1px solid var(--bd)}
.tb .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.ct{padding:20px 22px 60px;max-width:1180px}
/* 通用 */
.card{background:var(--panel);border:1px solid var(--bd);border-radius:10px;margin-bottom:16px;overflow:hidden}
.card-h{padding:13px 18px;border-bottom:1px solid var(--bd2);display:flex;align-items:center;gap:10px}
.card-h h3{font-size:14px;font-weight:600}
.card-h .sub{font-size:12px;color:var(--mut)}
.card-h .r{margin-left:auto}
.card-b{padding:16px 18px}
.card-b.tb0{padding-top:0}
.btn{border:1px solid var(--bd);background:#fff;color:var(--tx2);padding:7px 14px;border-radius:7px;
  cursor:pointer;font-size:13px;font-family:inherit;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--pri);color:var(--pri)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:#1a52d8;color:#fff}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.dan{color:var(--er);border-color:#f5c2c2}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.gb{background:var(--gr-l)}
table{width:100%;border-collapse:collapse}
th{background:#fafbfc;text-align:left;padding:9px 12px;font-size:12px;color:var(--tx2);
  font-weight:600;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--bd2);vertical-align:top}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fcfdfe}
.ct{text-align:center}.rd{text-align:right}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:Consolas,Monaco,monospace;font-size:12px}
.tag{display:inline-block;padding:1px 8px;border-radius:4px;font-size:11px;font-weight:500;white-space:nowrap}
.tag.b{background:var(--pri-l);color:var(--pri)}
.tag.g{background:var(--ok-l);color:var(--ok)}
.tag.o{background:var(--wn-l);color:var(--wn)}
.tag.r{background:var(--er-l);color:var(--er)}
.tag.gr{background:var(--gr-l);color:var(--gr)}
.sm{font-size:12px}
.mut{color:var(--mut)}
.b{font-weight:600}
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mb{margin-bottom:16px}.mt{margin-top:12px}
.alert{display:flex;gap:9px;padding:11px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;line-height:1.65}
.alert i{font-style:normal;font-weight:700;flex:0 0 18px;height:18px;line-height:18px;text-align:center;
  border-radius:50%;font-size:11px;background:rgba(0,0,0,.08)}
.alert.b{background:var(--pri-l);color:#1e40af}
.alert.g{background:var(--ok-l);color:#065f46}
.alert.o{background:var(--wn-l);color:#92400e}
.alert.r{background:var(--er-l);color:#991b1b}
.alert .x{margin-left:auto;cursor:pointer;color:inherit;opacity:.5;font-size:15px;line-height:1}
/* 表单 */
.fg{margin-bottom:14px}
.fg>label{display:block;font-size:12.5px;color:var(--tx2);font-weight:600;margin-bottom:5px}
.fg>label .req{color:var(--er);margin-left:3px}
.fg>label .op{color:var(--mut);font-weight:400;margin-left:4px;font-size:11px}
input[type=text],input[type=number],input[type=date],input[type=tel],select,textarea{
  width:100%;padding:8px 11px;border:1px solid var(--bd);border-radius:7px;font-size:13px;
  font-family:inherit;color:var(--tx);background:#fff;transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-l)}
textarea{min-height:70px;resize:vertical;line-height:1.6}
.hint{font-size:11.5px;color:var(--mut);margin-top:4px;line-height:1.55}
.grid{display:grid;gap:12px 16px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
.g4{grid-template-columns:1fr 1fr 1fr 1fr}
.chk{display:flex;flex-wrap:wrap;gap:8px}
.chk label{display:flex;align-items:center;gap:6px;border:1px solid var(--bd);border-radius:7px;
  padding:7px 11px;cursor:pointer;font-size:12.5px;background:#fff;transition:.15s}
.chk label:hover{border-color:var(--pri)}
.chk input{accent-color:var(--pri);width:14px;height:14px}
.chk label.on{border-color:var(--pri);background:var(--pri-l);color:var(--pri);font-weight:500}
/* 档位卡 */
.mcol{margin-bottom:18px}
.mcol-h{display:flex;align-items:center;gap:9px;padding:9px 14px;border-radius:8px 8px 0 0;font-size:13px;font-weight:600}
.mcol-h .n{margin-left:auto;font-size:12px;font-weight:400;opacity:.8}
.mc{border:1px solid var(--bd);border-top:none;background:#fff}
.mc:last-child{border-radius:0 0 8px 8px}
.mrow{padding:12px 14px;border-bottom:1px solid var(--bd2);display:flex;gap:14px;align-items:flex-start}
.mrow:last-child{border-bottom:none}
.mrow .info{flex:1;min-width:0}
.mrow .info h4{font-size:13.5px;font-weight:600;margin-bottom:3px}
.mrow .info .meta{font-size:12px;color:var(--mut)}
.mrow .rsn{flex:0 0 300px;font-size:12px;line-height:1.75}
.mrow .rsn div{display:flex;gap:6px}
.mrow .rsn .k{flex:0 0 34px;font-weight:600;color:var(--tx2)}
.mrow .act{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.ml-g{background:var(--ok-l);color:var(--ok)}.mc-g{border-color:#b7e4dd}
.ml-b{background:var(--pri-l);color:var(--pri)}.mc-b{border-color:#c3d8ff}
.ml-r{background:var(--er-l);color:var(--er)}.mc-r{border-color:#f5c2c2}
.ml-u{background:var(--gr-l);color:var(--gr)}.mc-u{border-color:#dbe2ea}
/* 二维码 */
.qrw{display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap}
.qrbox{flex:0 0 auto;text-align:center;padding:14px;background:#fff;border:1px solid var(--bd);border-radius:10px}
.qrbox svg{display:block;margin:0 auto}
.qrbox .cap{font-size:11.5px;color:var(--mut);margin-top:8px}
.lnk{display:flex;gap:7px;align-items:center;margin-top:10px}
.lnk input{font-family:Consolas,Monaco,monospace;font-size:11.5px}
.sitebox{margin-top:10px;background:#f8fafc;border:1px solid var(--bd2);border-radius:8px;padding:9px 10px}
.sitebox .t{font-size:11.5px;color:var(--tx2);font-weight:600;margin-bottom:6px}
.sitebox .rw{display:flex;gap:6px;align-items:center}
.sitebox input{flex:1;font-family:Consolas,Monaco,monospace;font-size:11.5px}
.sitebox .tip{font-size:11px;color:var(--mut);margin-top:6px;line-height:1.55}
/* 扫码模式（供应商端全屏：隐藏研发端外壳） */
body.scan .sb{display:none}
body.scan .mn{margin-left:0}
body.scan .tb{display:none}
body.scan .ct{padding:0;max-width:none}
body.scan .phonew{padding:0;min-height:100vh}
body.scan .phone{width:100%;max-width:520px;border:0;border-radius:0;box-shadow:none}
body.scan .phone .body{max-height:none;overflow:visible;padding:14px 14px 46px}
/* 手机模拟 */
.phonew{display:flex;justify-content:center;padding:8px 0 20px}
.phone{width:390px;background:#fff;border:1px solid #cbd5e1;border-radius:26px;overflow:hidden;
  box-shadow:0 8px 28px rgba(15,23,42,.13)}
.phone .bar{background:#0f172a;color:#fff;padding:9px 14px;font-size:12px;display:flex;align-items:center;gap:8px}
.phone .bar .t{flex:1;text-align:center;font-weight:500}
.phone .body{max-height:640px;overflow-y:auto;padding:14px}
.phone .body::-webkit-scrollbar{width:5px}
.phone .body::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
.psec{background:#f8fafc;border:1px solid var(--bd2);border-radius:8px;padding:11px 12px;margin-bottom:13px}
.psec h5{font-size:12px;color:var(--tx2);font-weight:600;margin-bottom:6px}
.psec .kv{display:flex;font-size:12px;padding:2.5px 0;line-height:1.5}
.psec .kv .k{flex:0 0 74px;color:var(--mut)}
.psec .kv .v{flex:1;color:var(--tx)}
.pfg{margin-bottom:11px}
.pfg label{display:block;font-size:11.5px;color:var(--tx2);font-weight:600;margin-bottom:4px}
.pfg label .req{color:var(--er)}
.pfg input,.pfg select,.pfg textarea{padding:7px 9px;font-size:12.5px;border-radius:6px}
.pfg textarea{min-height:48px}
.prow{display:flex;gap:9px}
.prow>*{flex:1}
.pinline{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--tx2);margin-top:4px}
.pinline input{width:64px;flex:0 0 auto}
/* 构件清单表 */
.itab{width:100%;border-collapse:collapse;font-size:12px}
.itab th,.itab td{border:1px solid var(--bd2);padding:5px 7px;vertical-align:middle;line-height:1.5}
.itab th{background:#f8fafc;font-weight:600;color:var(--tx2);text-align:left;white-space:nowrap}
.itab input{width:100%;box-sizing:border-box;padding:4px 6px;font-size:12px;border:1px solid var(--bd);border-radius:5px}
.itab input:focus{outline:none;border-color:var(--br);box-shadow:0 0 0 2px var(--br-bg)}
.itab td.num,.itab th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.itab td.ct,.itab th.ct{text-align:center}
.itab .sp2{color:var(--mut);font-size:11px;line-height:1.4;margin-top:2px}
.itab tfoot td{background:#f1f5f9;font-weight:600}
.itab .low{color:var(--ok);font-weight:700}
.itab .high{color:var(--er)}
.itab .na{color:#cbd5e1}
.phone .itab{font-size:11px}
.phone .itab th,.phone .itab td{padding:4px 3px}
.phone .itab input{padding:4px 3px;font-size:11.5px;text-align:right}
.phone .itab .sp2{font-size:10px}
/* 抽屉 */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:50;display:none}
.mask.on{display:block}
.dw{position:fixed;right:0;top:0;height:100vh;width:520px;background:#fff;z-index:51;
  box-shadow:-6px 0 24px rgba(15,23,42,.14);transform:translateX(100%);transition:.22s;
  display:flex;flex-direction:column}
.dw.on{transform:none}
.dw-h{padding:15px 20px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px}
.dw-h h3{font-size:15px}
.dw-h .x{margin-left:auto;cursor:pointer;color:var(--mut);font-size:19px;line-height:1}
.dw-b{flex:1;overflow-y:auto;padding:18px 20px}
.empty{text-align:center;padding:44px 20px;color:var(--mut);font-size:13px}
.empty .ic{font-size:30px;opacity:.3;margin-bottom:8px}
hr.sp{border:none;border-top:1px solid var(--bd2);margin:16px 0}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--bd);border-radius:9px;padding:12px 14px}
.stat .l{font-size:11.5px;color:var(--mut)}
.stat .v{font-size:21px;font-weight:600;margin:1px 0}
.stat .v small{font-size:11px;font-weight:400;color:var(--mut);margin-left:2px}
.stat .d{font-size:11px;color:var(--mut)}
.bar{height:6px;background:var(--bd2);border-radius:3px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--pri)}
.stepdot{display:flex;align-items:center;gap:0;flex-wrap:wrap;margin-bottom:16px}
.stepdot .s{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--mut)}
.stepdot .s .n{width:22px;height:22px;border-radius:50%;background:var(--gr-l);color:var(--gr);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.stepdot .s.on{color:var(--pri);font-weight:600}
.stepdot .s.on .n{background:var(--pri);color:#fff}
.stepdot .s.done .n{background:var(--ok);color:#fff}
.stepdot .ar{flex:0 0 26px;height:1px;background:var(--bd);margin:0 6px}
</style>
</head>
<body>
<div class="app">
  <aside class="sb">
    <div class="sb-h"><h1>研发供应商资源平台</h1><span>R&amp;D Supplier Hub · v1</span></div>
    <nav id="nav">
      <a data-p="list"><i>▤</i>需求列表<b id="bgList">3</b></a>
      <a data-p="match"><i>◎</i>智能匹配</a>
      <a data-p="quote"><i>¥</i>询价比价<b id="bgQuote">0</b></a>
      <a data-p="lib"><i>◈</i>供应商库<b id="bgLib">0</b></a>
    </nav>
    <div class="sb-f">
      <b>依据</b>：简易任务书 v1<br>
      <b>三功能</b>：需求发布 / 智能匹配 / 询价比价<br>
      <b>判定</b>：三档条文，无分数无权重
    </div>
  </aside>
  <div class="mn">
    <div class="tb">
      <h2 id="pgTitle">需求列表</h2><span class="crumb" id="pgCrumb">全部需求</span>
      <div class="r" id="tbR"></div>
    </div>
    <div class="ct" id="view"></div>
  </div>
</div>
<div class="mask" id="mask" onclick="closeDw()"></div>
<div class="dw" id="dw"><div class="dw-h"><h3 id="dwT">详情</h3><span class="x" onclick="closeDw()">×</span></div>
  <div class="dw-b" id="dwB"></div></div>

<script>
/* =======================================================================
   零依赖二维码编码器  byte mode / EC level M / version 1-10
   ======================================================================= */
const QR=(function(){
  const EXP=new Array(512),LOG=new Array(256);
  (function(){let x=1;for(let i=0;i<255;i++){EXP[i]=x;LOG[x]=i;x<<=1;if(x&0x100)x^=0x11D;}
    for(let i=255;i<512;i++)EXP[i]=EXP[i-255];})();
  const mul=(a,b)=>(a===0||b===0)?0:EXP[LOG[a]+LOG[b]];
  function genPoly(n){let p=[1];
    for(let i=0;i<n;i++){const np=new Array(p.length+1).fill(0);
      for(let j=0;j<p.length;j++){np[j]^=mul(p[j],EXP[i]);np[j+1]^=p[j];}p=np;}
    return p.slice().reverse();}
  function rsRem(data,ecLen){
    const g=genPoly(ecLen),res=new Array(data.length+ecLen).fill(0);
    for(let i=0;i<data.length;i++)res[i]=data[i];
    for(let i=0;i<data.length;i++){const c=res[i];
      if(c!==0)for(let j=1;j<g.length;j++)res[i+j]^=mul(g[j],c);}
    return res.slice(data.length);}
  /* [数据码字总数, 每块数据码字数, 每块纠错码字数] —— M 级（15% 纠错），v1–v25 */
  const SPEC={1:[16,[16],10],2:[28,[28],16],3:[44,[44],26],4:[64,[32,32],18],5:[86,[43,43],24],
    6:[108,[27,27,27,27],16],7:[124,[31,31,31,31],18],8:[154,[38,38,39,39],22],
    9:[182,[36,36,36,37,37],22],10:[216,[43,43,43,43,44],26],
    11:[254,[50,51,51,51,51],30],12:[290,[36,36,36,36,36,36,37,37],22],
    13:[334,[37,37,37,37,37,37,37,37,38],22],14:[365,[40,40,40,40,41,41,41,41,41],24],
    15:[415,[41,41,41,41,41,42,42,42,42,42],24],16:[453,[45,45,45,45,45,45,45,46,46,46],28],
    17:[507,[46,46,46,46,46,46,46,46,46,46,47],28],
    18:[563,[43,43,43,43,43,43,43,43,43,44,44,44,44],26],
    19:[627,[44,44,44,45,45,45,45,45,45,45,45,45,45,45],26],
    20:[669,[41,41,41,42,42,42,42,42,42,42,42,42,42,42,42,42],26],
    21:[714,[42,42,42,42,42,42,42,42,42,42,42,42,42,42,42,42,42],26],
    22:[782,[46,46,46,46,46,46,46,46,46,46,46,46,46,46,46,46,46],28],
    23:[860,[47,47,47,47,48,48,48,48,48,48,48,48,48,48,48,48,48,48],28],
    24:[914,[45,45,45,45,45,45,46,46,46,46,46,46,46,46,46,46,46,46,46,46],28],
    25:[1000,[47,47,47,47,47,47,47,47,48,48,48,48,48,48,48,48,48,48,48,48,48],28]};
  const MAXVER=25;
  const ALIGN={1:[],2:[6,18],3:[6,22],4:[6,26],5:[6,30],6:[6,34],7:[6,22,38],8:[6,24,42],9:[6,26,46],
    10:[6,28,50],11:[6,30,54],12:[6,32,58],13:[6,34,62],14:[6,26,46,66],15:[6,26,48,70],
    16:[6,26,50,74],17:[6,30,54,78],18:[6,30,56,82],19:[6,30,58,86],20:[6,34,62,90],
    21:[6,28,50,72,94],22:[6,26,50,74,98],23:[6,30,54,78,102],24:[6,28,54,80,106],25:[6,32,58,84,110]};
  /* 指定版本在 byte 模式下能装多少字节（用于容量预判与提示） */
  function byteCap(v){
    if(!SPEC[v])return 0;
    return Math.floor((SPEC[v][0]*8-(4+(v<=9?8:16)))/8);
  }
  function bchFmt(d){let v=d<<10;for(let i=4;i>=0;i--)if((v>>(10+i))&1)v^=0x537<<i;return ((d<<10)|v)^0x5412;}
  function bchVer(d){let v=d<<12;for(let i=5;i>=0;i--)if((v>>(12+i))&1)v^=0x1F25<<i;return (d<<12)|v;}
  function utf8(s){const o=[];for(const ch of s){const c=ch.codePointAt(0);
    if(c<0x80)o.push(c);
    else if(c<0x800)o.push(0xC0|(c>>6),0x80|(c&63));
    else if(c<0x10000)o.push(0xE0|(c>>12),0x80|((c>>6)&63),0x80|(c&63));
    else o.push(0xF0|(c>>18),0x80|((c>>12)&63),0x80|((c>>6)&63),0x80|(c&63));}
    return o;}
  function encode(text){
    const bytes=utf8(text);let ver=0;
    for(let v=1;v<=MAXVER;v++){
      const need=4+(v<=9?8:16)+bytes.length*8;
      if(need<=SPEC[v][0]*8){ver=v;break;}}

      +'<rect width="'+tot+'" height="'+tot+'" fill="#fff"/><path d="'+d+'" transform="translate('+pad+','+pad+')" fill="#0f172a"/></svg>';

/* ---- 扫码链接 = 本页地址 + ?p=s1&d=需求号（扫出来直接进扫码报价页） ---- */
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function isHttp(){return location.protocol==='http:'||location.protocol==='https:';}
/* 二维码前缀优先级：手填/存过的公网域名 > 当前站点目录 > 占位域名 */
function siteBase(){
  const s=lsGet('rd_site');
  if(s)return String(s).replace(/\/+$/,'');
  if(isHttp())return location.origin+location.pathname.replace(/[^/]*$/,'').replace(/\/+$/,'');
  return SITE_DEFAULT;
}
function isPlaceholder(){return siteBase().indexOf('yourco.cn')>=0;}
/* ---- 需求「随链接走」----------------------------------------------------
   原型没有后端：研发在自己电脑上新建的需求，手机端是取不到的，
   所以把需求内容压进二维码链接（?x=…）。手机扫码时用链接里的数据渲染，
   不再去 DEMANDS 里找 —— 这才是「扫出来就有表格」的根本解法。
   装不下时自动退回「只带需求号」的短链，并提示改用导出 HTML。          */
function packClean(s,max){
  let t=String(s==null?'':s)
    .replace(/[~;,|&=+#%?/\\<>"'`^\[\]{}]/g,'')
    .replace(/\s+/g,'_').trim();
  return max&&t.length>max?t.slice(0,max)+'…':t;
}
function packUnclean(s){return String(s==null?'':s).replace(/_/g,' ');}
/* 三档压缩：0 完整 / 1 精简 / 2 极简。二维码越密越难扫，装不下就退档 */
const PACK_CFG=[[26,110,18,40,14,18],[20,40,8,0,10,10],[15,24,6,0,8,8]];
/*                标题  描述  地点 验收 构件名 规格 */
/* 打包格式 v2：预算由「区间」改为单个金额，少一个字段。
   v1（16 段）旧链接仍可解析，预算取其上限，避免老二维码直接失效。 */
function packDemand(d,lv){
  const c=PACK_CFG[lv]||PACK_CFG[0];
  const f=[packClean(d.title,c[0]),packClean(d.desc,c[1]),packClean(d.size,22),
    packClean(d.acc),packClean(d.cycle),packClean(d.qty),packClean(d.delivery,18),
    packClean(d.budget),packClean(d.place,c[2]),
    packClean(d.deadline,16),c[3]?packClean(d.acceptance,c[3]):'',
    (d.certs||[]).map(x=>packClean(x,6)).join('.')];
  const items=(d.items||[]).map(it=>[packClean(it.name,c[4]),packClean(it.spec,c[5]),
    packClean(it.unit,4),packClean(it.qty)].join(',')).join(';');
  return ['2',packClean(d.id,20)].concat(f).concat([items]).join('~');
}
function unpackDemand(x){
  try{
    const a=String(x).split('~');
    const ver=a[0];
    if(ver==='1'&&a.length>=16){
      const nn=v=>{const n=parseFloat(v);return isNaN(n)?null:n;};
      const o={id:packUnclean(a[1]),title:packUnclean(a[2]),desc:packUnclean(a[3]),
        size:packUnclean(a[4]),acc:nn(a[5]),cycle:nn(a[6]),qty:nn(a[7])||1,
        delivery:packUnclean(a[8]),budget:nn(a[10])||0,
        place:packUnclean(a[11]),deadline:packUnclean(a[12]),acceptance:packUnclean(a[13]),
        certs:String(a[14]||'').split('.').filter(Boolean),
        drawings:[],closed:false,status:'询价中',fromLink:true,
        items:String(a[15]||'').split(';').filter(Boolean).map(function(t){
          const c=t.split(',');
          return {name:packUnclean(c[0]),spec:packUnclean(c[1]),unit:packUnclean(c[2]),
            qty:parseFloat(c[3])||1,remark:''};
        })};
      return (o.id&&o.items.length)?o:null;
    }
    if(a.length<15||ver!=='2')return null;
    const num2=v=>{const n=parseFloat(v);return isNaN(n)?null:n;};
    const d={id:packUnclean(a[1]),title:packUnclean(a[2]),desc:packUnclean(a[3]),
      size:packUnclean(a[4]),acc:num2(a[5]),cycle:num2(a[6]),qty:num2(a[7])||1,
      delivery:packUnclean(a[8]),budget:num2(a[9])||0,
      place:packUnclean(a[10]),deadline:packUnclean(a[11]),acceptance:packUnclean(a[12]),
      certs:String(a[13]||'').split('.').filter(Boolean),
      drawings:[],closed:false,status:'询价中',fromLink:true,
      items:String(a[14]||'').split(';').filter(Boolean).map(function(t){
        const c=t.split(',');
        return {name:packUnclean(c[0]),spec:packUnclean(c[1]),unit:packUnclean(c[2]),
          qty:parseFloat(c[3])||1,remark:''};
      })};
    if(!d.id||!d.items.length)return null;
    return d;
  }catch(e){return null;}
}
const PACK_MAXVER=20;                   /* 再密就扫不动了：超过这个版本改用导出 HTML */
/* 返回 {url, lv}：lv=0 完整 / 1 精简 / 2 极简 / -1 装不下（只带需求号） */
function qrUrlOf(d){
  const f=isHttp()?('/'+(location.pathname.split('/').pop()||'')):'/';
  const short=siteBase()+f+'?p=s1&d='+encodeURIComponent(d.id);
  for(let lv=0;lv<PACK_CFG.length;lv++){
    const u=short+'&x='+packDemand(d,lv);
    if(!QR.fits(u))continue;
    try{if(QR.encode(u).ver<=PACK_MAXVER)return {url:u,lv:lv};}catch(e){}
  }
  return {url:short,lv:-1};
}
function qrUrl(d){return qrUrlOf(d).url;}
/* 本机自测链接：file:// 也能直接打开，用来验证扫码页长什么样 */
function selfUrl(d){
  return location.href.split('#')[0].split('?')[0]+'?p=s1&d='+encodeURIComponent(d.id);
}

}

}

/* ---- 构件明细金额 ---- */
const itemQty=(d,i)=>{const it=(d&&d.items)?d.items[i]:null;return it?(Number(it.qty)||0):0;};
const itemSub=(d,it)=>Math.round((Number(it&&it.price)||0)*itemQty(d,it?it.i:0));
function itemSum(q){const d=DM(q.did);return (q.items||[]).reduce((a,it)=>a+itemSub(d,it),0);}
/* 有构件清单时以逐行合价为准，避免明细与总价对不上 */
function quoteBase(q){return (q.items&&q.items.length)?itemSum(q):(Number(q.total)||0);}
/* 未报价的构件项数：0 元或空都算「未含」 */
function missingItems(q){return (q.items||[]).filter(it=>it.price==null||Number(it.price)===0).length;}
/* 到手总价：唯一的计算 */
function landed(q){
  let v=quoteBase(q);
  if(!q.taxIncluded) v+=v*(q.taxRate||13)/100;   /* 计税基数必须与报价合价一致 */
  if(!q.freightIncluded) v+=q.freight||0;
  if(!q.installIncluded) v+=q.installFee||0;
  if(!q.designIncluded) v+=q.designFee||0;
  if(!q.trialIncluded) v+=q.trialFee||0;
  return v;
}
function landedExplain(q){
  const p=[];
  if(!q.taxIncluded)p.push('税 +'+fmt(Math.round(Math.round(quoteBase(q))*(q.taxRate||13)/100)));
  if(!q.freightIncluded)p.push('运费 +'+fmt(q.freight||0));
  if(!q.installIncluded)p.push('安装 +'+fmt(q.installFee||0));
  if(!q.designIncluded)p.push('设计 +'+fmt(q.designFee||0));
  if(!q.trialIncluded)p.push('试机 +'+fmt(q.trialFee||0));
  return p.length?p.join('；'):'口径已全含，无需折算';
}

/* ======================= 三档判定（条文，无分数） ======================= */
/* R1 能力边界（唯一硬门槛）→ R2 接单意愿 → R3 资质 → R4 预算 */
function judge(d,s){
  const R=[];
  const add=(k,ok,txt)=>R.push({k:k,ok:ok,txt:txt});
  /* R1 */
  const ds=dims(d.size),ss=dims(s.maxSize);
  let sizeOk=null,sizeTxt='';
  if(!ds.length||!ss.length){sizeTxt='尺寸数据缺失，无法判定';}
  else if(ds.length!==ss.length){sizeTxt='尺寸维度不一致（'+ds.length+'D vs '+ss.length+'D），无法判定';}
  else{sizeOk=ds.every((v,i)=>v<=ss[i]);
    sizeTxt='需求 '+d.size+' vs 厂 '+s.maxSize+' → '+(sizeOk?'满足':'<b>超出</b>');}
  let accOk=null,accTxt='';
  if(d.acc==null||s.acc==null){accTxt='精度数据缺失，无法判定';}
  else{accOk=d.acc>=s.acc;
    accTxt='需求 ±'+d.acc+'mm vs 厂 ±'+s.acc+'mm → '+(accOk?'厂能做到':'<b>厂达不到</b>');}
  let cyOk=null,cyTxt='';
  if(!d.cycle){cyTxt='本需求无节拍要求，跳过';cyOk=true;}
  else if(s.cycle==null){cyTxt='厂可达节拍未填，无法判定';}
  else if(s.cycle===0){cyOk=false;cyTxt='厂不做节拍类产品（档案填 0）→ <b>无法满足节拍要求</b>';}
  else{cyOk=d.cycle>=s.cycle;
    cyTxt='需求 '+d.cycle+'s/件 vs 厂 '+s.cycle+'s/件 → '+(cyOk?'厂做得到':'<b>厂达不到</b>');}
  const r1Unknown=[sizeOk,accOk,cyOk].indexOf(null)>=0;
  const r1Fail=[sizeOk,accOk,cyOk].indexOf(false)>=0;
  add('R1',r1Fail?false:r1Unknown?null:true,
    '尺寸：'+sizeTxt+'<br>精度：'+accTxt+'<br>节拍：'+cyTxt);
  /* R2 */
  const left=daysLeft(d.delivery);
  const qtyOk=(d.qty||0)>=(s.moq||0);
  const amtOk=(d.budget||0)>=(s.minAmount||0);
  const leadOk=s.leadDays==null?null:left>=(s.leadDays||0);
  const r2Ok=(qtyOk||amtOk)&&leadOk!==false;
  const r2Un=leadOk===null;
  add('R2',r2Un?null:r2Ok,
    '数量 '+d.qty+' vs MOQ '+(s.moq||0)+' → '+(qtyOk?'满足':'不满足')
    +'；预算 '+(d.budget||0)+' 万 vs 最小金额 '+(s.minAmount||0)+' 万 → '+(amtOk?'满足':'不满足')
    +'；剩余 '+left+' 天 vs 典型交期 '+(s.leadDays==null?'未填':s.leadDays+' 天')
    +(leadOk==null?' → <b>未知</b>':leadOk?' → 满足':' → <b>不够</b>')
    +(s.sample?'':'；<b>不接研发打样</b>'));
  if(!s.sample)R[R.length-1].ok=false;
  /* R3 */
  const miss=(d.certs||[]).filter(c=>(s.certs||[]).indexOf(c)<0);
  add('R3',miss.length?false:true,
    d.certs&&d.certs.length
      ? '需求要求：'+d.certs.map(c=>CERT_LABEL[c]).join('、')
        +' → '+(miss.length?'<b>缺 '+miss.map(c=>CERT_LABEL[c]).join('、')+'</b>':'全部满足')
      : '本需求无资质要求 → 满足');
  /* R4：预算是单个金额，判断它是否落在厂的价格量级上（低于厂最低量级 → 厂不接） */
  const bud=d.budget||0,pmin=s.priceMin||0,pmax=s.priceMax||0;
  const r4Low=!pmin||bud>=pmin;                 /* 预算达到厂最低量级 */
  const r4High=!pmax||bud<=pmax;                /* 未超出厂常规上限（超出只提示，不判死） */
  add('R4',r4Low,
    '预算 '+bud+' 万 vs 厂量级 '+pmin+'-'+pmax+' 万（'+s.unit+'）→ '
    +(r4Low?(r4High?'落在厂常规量级内 → 满足':'<b>高于厂常规上限</b>，接单前需确认产能')
           :'<b>低于厂最低量级</b>，厂可能不接'));
  /* 档位 */
  let grade;
  if(r1Unknown) grade='待确认';
  else if(r1Fail) grade='不符';
  else{
    const rest=[R[1].ok,R[2].ok,R[3].ok];
    grade=rest.every(x=>x===true)?'推荐':'可联系';
  }
  return {grade:grade,R:R,r1Unknown:r1Unknown,r1Fail:r1Fail};
}
function gradeOf(d,s){
  const ov=overrides[d.id+'_'+s.id];
  return ov?{grade:ov.grade,R:judge(d,s).R,manual:true,reason:ov.reason}:judge(d,s);
}

function pickFiles(inp){

function formVal(k){
  const el=document.querySelector('[data-k="'+k+'"]');
  return el?el.value.trim():'';
}
function saveDemand(draft){
  const title=formVal('title');
  const need=['title','desc','size','acc','cycle','qty','delivery','budget','place','deadline'];
  const miss=[];
  need.forEach(k=>{ if(!formVal(k)) miss.push({title:'需求标题',desc:'需求描述',size:'关键规格·尺寸',
    acc:'关键规格·精度',cycle:'关键规格·节拍',qty:'数量',delivery:'期望交期',
    budget:'预算',place:'交付地点',deadline:'报价截止时间'}[k]); });
  const certs=CERT_KEYS.filter(c=>{const el=document.querySelector('[data-c="'+c+'"]');return el&&el.checked;});
  if(!certs.length)miss.push('资质要求（至少勾一项，或明确无要求）');
  /* 构件清单：名称/规格/数量必填，否则供应商无从报价 */
  const items=formItems.map(function(it){
    return {name:String(it.name||'').trim(),spec:String(it.spec||'').trim(),
      unit:String(it.unit||'套').trim()||'套',qty:parseFloat(it.qty)||0,remark:String(it.remark||'').trim()};
  }).filter(function(it){return it.name;});
  if(!items.length)miss.push('构件清单（至少填一项的名称）');
  items.forEach(function(it,i){
    if(!it.spec)miss.push('构件清单第 '+(i+1)+' 项的规格');
    if(!(it.qty>0))miss.push('构件清单第 '+(i+1)+' 项的数量');
  });
  if(miss.length){
    setFlash('r','<b>还有必填项没填：</b>'+miss.join('、')+'。可以先「存为草稿」。');
    go('form');return;
  }
  const old=editingId?DM(editingId):null;
  const d=old?Object.assign({},old):{id:'',status:'草稿'};
  Object.assign(d,{
    title:title||'未命名需求',desc:formVal('desc'),size:formVal('size'),
    acc:num(formVal('acc')),cycle:num(formVal('cycle'))||0,qty:num(formVal('qty'))||1,
    delivery:formVal('delivery'),budget:num(formVal('budget'))||0,
    place:formVal('place'),deadline:formVal('deadline'),certs:certs,
    acceptance:formVal('acceptance'),note:formVal('note'),drawings:pendingFiles.slice(),
    items:items
  });
  const oldItems=(old&&old.items)?JSON.parse(JSON.stringify(old.items)):[];
  if(!old){d.id=nextId();DEMANDS.unshift(d);}
  else{const i=DEMANDS.indexOf(old);DEMANDS[i]=d;}
  /* 构件清单变了 → 已收报价按构件名称重新对齐，新增项留空待补 */
  const sig=a=>a.map(x=>x.name+'|'+x.qty).join('@@');
  const changed=old&&sig(oldItems)!==sig(items);
  const shifted=changed?realignQuotes(d,oldItems):0;
  if(!draft&&(d.status==='草稿'))d.status='询价中';
  if(draft)d.status='草稿';
  curDemand=d.id;editingId=null;pendingFiles=[];
  let msg='<b>需求 '+d.id+' 已保存。</b>共 '+items.length+' 项构件。下一步：生成询价单二维码转发微信。';
  if(shifted)msg+='　<span style="color:#b45309">构件清单已变更，'+shifted+' 份已收报价按构件名称重新对齐；新增构件对方尚未报价，需通知补报。</span>';
  setFlash(shifted?'o':'g',msg);
  go('invite');
}
/* 清单变更后：旧报价明细按构件名称搬运到新序号，对不上的留空 */
function realignQuotes(d,oldItems){
  let n=0;
  quotesOf(d.id).forEach(function(q){
    if(!q.items||!q.items.length)return;
    const priceOf=name=>{
      const k=oldItems.findIndex(x=>x.name===name);
      if(k<0)return null;
      const it=(q.items||[]).find(x=>x.i===k);
      return it?it.price:null;
    };
    let lost=0;
    const ni=(d.items||[]).map(function(it,i){
      const p=priceOf(it.name);
      if(p==null)lost++;
      return {i:i,price:p};
    });
    if(lost)n++;
    q.items=ni;
  });
  return n;
}
function nextId(){
  const ns=DEMANDS.map(d=>parseInt(String(d.id).replace(/\D/g,''),10)).filter(n=>!isNaN(n));
  return 'D-2026-'+String((Math.max.apply(null,ns.concat([0]))+1)).padStart(3,'0');
}

      <td class="num">${fill

      <th class="ct" style="width:56px">单位·数量</th>

    <tbody>${rows}</tbody>
    <tfoot><tr><td colspan="4" style="text-align:right">合价（尚未折算含税/运费等口径）</td>
      <td class="num"${fill?' id="q_sum"':''}>${fill?'<span class="na">—</span>':(q?fmt(Math.round(quoteBase(q))):'—')}</td>
    </tr></tfoot></table>`;
}
/* 供应商逐行填单价时实时算小计与合价 */
function calcS1(){
  const d=DM(s1Demand);if(!d)return 0;
  let sum=0;
  (d.items||[]).forEach(function(it,i){
    const el=$('qi_'+i),sub=$('qs_'+i);
    const raw=el?String(el.value).trim():'';
    const p=parseFloat(raw);
    const has=raw!==''&&!isNaN(p);
    if(has)sum+=p*(Number(it.qty)||0);
    if(sub)sub.innerHTML=has?fmt(Math.round(p*(Number(it.qty)||0))):'<span class="na">—</span>';
  });
  const s=$('q_sum');
  if(s)s.innerHTML=sum?('<b>'+fmt(Math.round(sum))+'</b>'):'<span class="na">—</span>';
  return sum;
}

/* ======================= 报价回传码（无后端的闭环） =======================
   原型没有服务器，供应商在手机上提交的报价回不到研发电脑。
   做法：提交后生成一段「回传码」文本（RDQ1.xxxx），供应商复制后微信发回，
   研发在 P5 询价比价页点「粘贴导入报价」一键入库。                        */
const b64enc=s=>btoa(unescape(encodeURIComponent(s)));
const b64dec=s=>decodeURIComponent(escape(atob(s)));
function quoteCode(q){
  const o={v:1,did:q.did,co:q.company,ct:q.contact,ph:q.phone,
    it:(q.items||[]).map(x=>[x.i,x.price==null?'':x.price]),
    ti:q.taxIncluded?1:0,tr:q.taxRate||13,
    fi:q.freightIncluded?1:0,fr:q.freight||0,
    ii:q.installIncluded?1:0,inf:q.installFee||0,
    di:q.designIncluded?1:0,df:q.designFee||0,
    si:q.trialIncluded?1:0,sf:q.trialFee||0,
    ld:q.leadDays||0,wa:q.warranty||12,vd:q.validDays||30,
    dv:q.deviation||'',nt:q.note||''};
  return 'RDQ1.'+b64enc(JSON.stringify(o));
}
/* 解析回传码 → 报价对象；失败返回 {error:'…'} */
function parseQuoteCode(text){
  const t=String(text||'').trim().replace(/\s+/g,'');
  if(t.indexOf('RDQ1.')!==0)return {error:'不是有效的回传码（应以 RDQ1. 开头）'};
  let o;
  try{o=JSON.parse(b64dec(t.slice(5)));}
  catch(e){return {error:'回传码解析失败，可能被截断或复制不全。请让供应商重新复制完整的一段。'};}
  if(!o||o.v!==1||!o.did)return {error:'回传码版本不匹配或缺少需求号'};
  if(!DEMANDS.some(x=>x.id===o.did))return {error:'回传码里的需求号 '+o.did+' 不在本平台需求列表中'};
  return {q:{
    did:o.did,company:o.co||'',contact:o.ct||'',phone:o.ph||'',
    items:(o.it||[]).map(a=>({i:Number(a[0])||0,price:a[1]===''||a[1]==null?null:Number(a[1])})),
    taxIncluded:!!o.ti,taxRate:Number(o.tr)||13,
    freightIncluded:!!o.fi,freight:Number(o.fr)||0,
    installIncluded:!!o.ii,installFee:Number(o.inf)||0,
    designIncluded:!!o.di,designFee:Number(o.df)||0,
    trialIncluded:!!o.si,trialFee:Number(o.sf)||0,
    leadDays:Number(o.ld)||0,warranty:Number(o.wa)||12,validDays:Number(o.vd)||30,
    deviation:o.dv||'',note:o.nt||'',at:TODAY
  }};
}

      点导入即进入比价表。同一家公司重复导入会覆盖上一次。</div></div>

      <textarea id="imp_code" style="min-height:96px;font-family:Consolas,Monaco,monospace;font-size:11.5px"
        placeholder="RDQ1.eyJ2IjoxLCJkaWQiOiJE…"></textarea></div>

}
function doImport(){
  const el=$('imp_code'),msg=$('imp_msg');if(!el)return;
  const r=parseQuoteCode(el.value);
  if(r.error){msg.innerHTML='<div class="alert r"><i>!</i><div>'+esc(r.error)+'</div></div>';return;}
  const q=r.q;
  q.status=SUPPLIERS.some(s=>s.name===q.company)?'已确认':'待核实';
  const dup=QUOTES.find(x=>x.did===q.did&&x.phone===q.phone&&x.phone);
  if(dup){Object.assign(dup,q);}
  else{q.id='Q'+String(QUOTES.length+1).padStart(3,'0');QUOTES.push(q);}
  closeDw();
  curDemand=q.did;
  setFlash('g','已导入 <b>'+esc(q.company)+'</b> 的报价（'+q.status+'），到手总价 '
    +fmt(Math.round(landed(q)))+' 元。'+(dup?'（覆盖了同一手机号的上一次报价）':''));
  go('quote');
}

const libOf=sid=>LIB.filter(x=>x.sid===sid)[0];
const libQuotes=e=>{const s=SM(e.sid);
  return s?QUOTES.filter(q=>q.company===s.name&&q.status==='已确认'):[];};
function libBest(e){
  const qs=libQuotes(e);
  return qs.length?Math.min.apply(null,qs.map(q=>Math.round(landed(q)))):null;
}
function libCoop(e){return libQuotes(e).map(q=>q.did);}
/* 最新一次入库时的档位（同一家被多个需求筛中时，取最近一条） */
function libGrade(e){return e.froms&&e.froms.length?e.froms[e.froms.length-1].grade:'—';}
/* 已有报价 → 自动提升为「已报价」，不用手工改 */
function libSyncStatus(e){
  if(!e||e.status==='已合作'||e.status==='已淘汰')return;
  if(libQuotes(e).length&&e.status!=='已报价')e.status='已报价';
}
/* 把一个需求的匹配结果刷进库：只收推荐/可联系，返回新增家数 */
function libSync(d){
  let added=0;
  SUPPLIERS.forEach(function(s){
    const g=gradeOf(d,s).grade;
    if(LIB_GRADES.indexOf(g)<0)return;
    let e=libOf(s.id);
    if(!e){e={sid:s.id,owner:'张工',status:'待联系',touchAt:'',tags:[],froms:[],notes:[]};
      LIB.push(e);added++;}
    else if(e.status==='已淘汰')return;      /* 已淘汰的不再自动拉回来 */
    if(!e.tags)e.tags=[]; if(!e.notes)e.notes=[]; if(!e.froms)e.froms=[];
    const f=e.froms.filter(x=>x.did===d.id)[0];
    if(f)f.grade=g; else e.froms.push({did:d.id,grade:g,at:TODAY});
    libSyncStatus(e);
  });
  return added;
}
function libAdd(sid,did){
  let e=libOf(sid);
  if(!e){e={sid:sid,owner:'张工',status:'待联系',touchAt:'',tags:[],froms:[],notes:[]};LIB.push(e);}
  const d=DM(did);
  if(d){const g=gradeOf(d,SM(sid)).grade;
    const f=e.froms.filter(x=>x.did===d.id)[0];
    if(f)f.grade=g; else e.froms.push({did:d.id,grade:g,at:TODAY});}
  libSyncStatus(e);
  setFlash('g','<b>'+esc(SM(sid).name)+'</b> 已加入供应商库。');
  go(curPage);
}

function libExclude(sid){
  const e=libOf(sid);if(!e)return;
  e.status='已淘汰';
  setFlash('o','<b>'+esc(SM(sid).name)+'</b> 已标记「已淘汰」，从候选名单隐藏。<br>档案仍在 P6，入库与报价历史保留 —— 需要时在状态筛选里选「已淘汰」即可找回。');
  go(curPage);
}
function libRestore(sid){
  const e=libOf(sid);if(!e)return;

function libSetStatus(sid,v){

/* 构件逐项比价：行=构件，列=各家单价 */
function itemCompare(d,list){
  const items=(d&&d.items)?d.items:[];
  if(!items.length||!list.length)return '';
  const col=i=>list.map(function(q){
    const x=(q.items||[]).filter(function(y){return y.i===i;})[0];
    return x?x.price:null;
  });
  let best=0;
  const body=items.map(function(it,i){
    const ps=col(i);
    const ok=ps.filter(function(p){return p!=null&&Number(p)>0;});
    const mn=ok.length?Math.min.apply(null,ok):null;
    const mx=ok.length?Math.max.apply(null,ok):null;
    if(mn!=null)best+=mn*(Number(it.qty)||0);
    return `<tr><td class="ct mut">${i+1}</td>
      <td><div class="b">${esc(it.name)}</div><div class="sp2">${esc(it.spec)}</div></td>
      <td class="ct">${esc(it.qty)} <span class="sp2">${esc(it.unit)}</span></td>
      ${ps.map(function(p){
        let c='',t;
        if(p==null){c='na';t='未报';}
        else if(Number(p)===0){c='high';t='0';}
        else{t=fmt(Number(p));
          if(ok.length>1&&Number(p)===mn)c='low';
          else if(ok.length>1&&Number(p)===mx)c='high';}
        return '<td class="num '+c+'">'+t+'</td>';}).join('')}
      <td class="num">${mn==null?'—':fmt(mn)}</td></tr>`;
  }).join('');
  const holes=list.filter(function(q){return missingItems(q)>0;});
  const minBase=Math.min.apply(null,list.map(function(q){return quoteBase(q);}));
  return `<div class="card"><div class="card-h"><h3>构件逐项比价</h3>
    <div class="sub">${items.length} 项构件 × ${list.length} 家 · 单价为各家填报的裸单价，口径折算见下方合价表</div>
    <div class="r"><span class="sm mut"><span style="color:var(--ok);font-weight:700">绿</span>=行内最低 ·
      <span style="color:var(--er)">红</span>=行内最高或未含</span></div></div>
  <table class="itab"><thead><tr><th class="ct" style="width:24px">序</th><th>构件 / 规格</th>
    <th class="ct" style="width:58px">数量</th>
    ${list.map(function(q){return '<th class="num">'+esc(q.company)+'</th>';}).join('')}
    <th class="num" style="width:76px">行内最低</th></tr></thead>
    <tbody>${body}</tbody>
    <tfoot><tr><td colspan="3" style="text-align:right">构件合价（元）</td>
      ${list.map(function(q){return '<td class="num">'+fmt(Math.round(quoteBase(q)))+'</td>';}).join('')}
      <td class="num mut">—</td></tr></tfoot></table>
    <div class="card-b" style="border-top:1px solid var(--bd2)">
      ${holes.length?`<div class="alert r" style="margin-bottom:9px"><i>!</i><div>
        <b>有报价存在未含项，合价不能直接横比：</b>
        ${holes.map(function(q){
          const nm=(q.items||[]).filter(function(x){return x.price==null||Number(x.price)===0;})
            .map(function(x){return (d.items[x.i]||{}).name;}).filter(Boolean).join('、');
          return esc(q.company)+'（'+esc(nm)+'）';}).join('；')}。
        这些构件的钱不在合价里 —— 先补回再比，否则是拿对方的漏项当便宜。</div></div>`:''}
      <div class="alert b" style="margin-bottom:0"><i>!</i><div>
        每项都取最低价的理论合价 <b>${fmt(Math.round(best))}</b> 元（${wan(best)} 万），
        对比最低整单合价 <b>${fmt(Math.round(minBase))}</b> 元，
        ${best<minBase?'低 '+fmt(Math.round(minBase-best))+' 元':'高 '+fmt(Math.round(best-minBase))+' 元'}。
        仅供参照：拆给多家做，接口配合与联调风险要自己背。</div></div>
    </div></div>`;
}

function libByName(name){
  const s=SUPPLIERS.filter(x=>x.name===name)[0];
  return s?libOf(s.id):null;
}
function confirmQ(id){const q=QUOTES.find(x=>x.id===id);if(!q)return;
  q.status='已确认';
  const s=SUPPLIERS.filter(x=>x.name===q.company)[0];
  if(!s)setFlash('g','<b>'+esc(q.company)+'</b> 已确认，进入比价表。<br>这家还不在供应商档案里 —— 建议到 P6 补一份档案，再把它收进供应商库，别让联系方式丢在聊天记录里。');
  else setFlash('g','<b>'+esc(q.company)+'</b> 已确认，进入比价表。');
  go('quote');}
function dropQ(id){const q=QUOTES.find(x=>x.id===id);if(!q)return;
  QUOTES.splice(QUOTES.indexOf(q),1);setFlash('b','已忽略该报价。');go('quote');}
function award(id){
  const q=QUOTES.find(x=>x.id===id);if(!q)return;
  const d=DM(q.did);if(d){d.status='已定标';d.closed=true;}
  /* 定标 → 供应商库里标记为「已合作」，这是一次合作闭环的落点 */
  const e=libByName(q.company);
  let extra='';
  if(e){e.status='已合作';e.touchAt=TODAY;
    if(!e.notes)e.notes=[];
    e.notes.push({at:TODAY,txt:'中标并定标 '+d.id+'，到手总价 '+fmt(Math.round(landed(q)))+' 元'});
    extra='<br>已在供应商库标记「已合作」。';}
  else extra='<br>这家不在供应商库里 —— 建议到 P6 补档案后收进库中，下次直接复用。';
  setFlash('g','<b>已定标给 '+esc(q.company)+'</b>，到手总价 '+fmt(Math.round(landed(q)))+' 元。需求 '+d.id+' 状态 → 已定标。'+extra);
  go('quote');
}

function libList(){
  LIB.forEach(libSyncStatus);
  let a=LIB.filter(e=>SM(e.sid));

  if(kw)a=a.filter(e=>{const s=SM(e.sid);
    return s.name.indexOf(kw)>=0||s.city.indexOf(kw)>=0||String(s.contact).indexOf(kw)>=0
      ||(e.tags||[]).join('、').indexOf(kw)>=0;});
  if(libF.status)a=a.filter(e=>e.status===libF.status);
  else a=a.filter(e=>e.status!=='已淘汰');           /* 默认隐藏已淘汰 */
  if(libF.did)a=a.filter(e=>(e.froms||[]).some(f=>f.did===libF.did));

    a=a.slice().sort((x,y)=>(libBest(x)==null?1e15:libBest(x))-(libBest(y)==null?1e15:libBest(y)));
  else a=a.slice().sort((x,y)=>String(y.touchAt||'').localeCompare(String(x.touchAt||'')));
  return a;
}

function submitQ(){
  const g=id=>{const el=$(id);return el?el.value.trim():'';};
  const d=DM(s1Demand);
  if(!d)return;
  if((daysLeft(String(d.deadline).slice(0,10))<0)||d.closed){
    const m=$('q_msg');
    if(m)m.innerHTML='<div class="alert o" style="font-size:12px;margin:6px 0"><i>!</i><div>该询价单已截止，无法提交。</div></div>';
    return;
  }
  const hasItems=!!(d&&d.items&&d.items.length);
  const need={q_company:'公司名称',q_contact:'联系人',q_phone:'手机号',
    q_lead:'交货周期',q_warranty:'质保',q_valid:'报价有效期',q_dev:'偏离说明'};
  if(!hasItems)need.q_total='报价总价';
  const miss=[];
  Object.keys(need).forEach(k=>{if(!g(k))miss.push(need[k]);});
  /* 逐行单价：不做某项可填 0，但不能留空 —— 留空会让比价出现窟窿 */
  let items=[],blank=[];
  if(hasItems){
    items=(d.items||[]).map(function(it,i){
      const el=$('qi_'+i),raw=el?String(el.value).trim():'';
      if(raw==='')blank.push('第 '+(i+1)+' 项「'+it.name+'」');
      return {i:i,price:raw===''?null:(parseFloat(raw)||0)};
    });
  }
  const msg=$('q_msg');
  if(miss.length||blank.length){
    msg.innerHTML='<div class="alert r" style="font-size:12px;margin:6px 0"><i>!</i><div>'
      +(miss.length?'请填写：'+miss.join('、'):'')
      +(blank.length?(miss.length?'<br>':'')+'单价未填：'+blank.join('、')+'<br>不做该项请填 0，不要留空。':'')
      +'</div></div>';
    return;
  }
  const sum=hasItems?items.reduce(function(a,b){return a+((Number(b.price)||0)*itemQty(d,b.i));},0)
                    :(num(g('q_total'))||0);
  const phone=g('q_phone'),company=g('q_company');
  const dup=QUOTES.find(q=>q.did===s1Demand&&q.phone===phone);
  if(dup){
    msg.innerHTML='<div class="alert o" style="font-size:12px;margin:6px 0"><i>!</i><div>该手机号已提交过报价（'
      +esc(dup.company)+' '+fmt(dup.total)+' 元），已为您更新为本次内容。</div></div>';
    fillQ(dup);return;
  }
  const q={id:'Q'+String(QUOTES.length+1).padStart(3,'0'),did:s1Demand,company:company,
    contact:g('q_contact'),phone:phone,items:items,total:Math.round(sum),
    taxIncluded:g('q_tax')==='1',taxRate:num(g('q_taxrate'))||13,
    freightIncluded:g('q_freight')==='1',freight:num(g('q_freightfee'))||0,
    installIncluded:g('q_install')==='1',installFee:num(g('q_installfee'))||0,
    designIncluded:g('q_design')==='1',designFee:num(g('q_designfee'))||0,
    trialIncluded:g('q_trial')==='1',trialFee:num(g('q_trialfee'))||0,
    leadDays:num(g('q_lead'))||0,warranty:num(g('q_warranty'))||12,validDays:num(g('q_valid'))||30,
    deviation:g('q_dev'),note:g('q_note'),
    status:SUPPLIERS.some(s=>s.name===company)?'已确认':'待核实',at:TODAY+' 12:00'};
  QUOTES.push(q);
  const code=quoteCode(q);
  msg.innerHTML='<div class="alert g" style="font-size:12px;margin:6px 0"><i>✓</i><div>提交成功。'
    +(hasItems?'构件合价 <b>'+fmt(Math.round(sum))+'</b> 元，':'')
    +'按统一口径折算后<b>到手总价 '+fmt(Math.round(landed(q)))+'</b> 元'
    +(q.status==='待核实'?'。<br>您不在供应商档案中，研发核实身份后才会进入比价表。':'。')
    +'</div></div>'
    /* 原型没有服务器：手机上的提交回不到研发电脑，只能靠这段回传码人工带回去 */
    +'<div style="border:1px solid var(--bd);border-radius:8px;padding:9px 10px;margin:8px 0;background:#f8fafc">'
    +'<div style="font-size:11.5px;font-weight:600;margin-bottom:5px">把这段回传码发给研发</div>'
    +'<div style="font-size:10.5px;color:var(--mut);margin-bottom:6px;line-height:1.5">'
    +'本页提交的内容不会自动同步到研发电脑（平台未部署服务器）。复制下面的码，微信发给对接的研发工程师，'
    +'他在「询价比价」粘贴导入即可。</div>'
    +'<textarea id="qcode" readonly style="min-height:58px;font-family:Consolas,Monaco,monospace;font-size:10.5px">'
    +esc(code)+'</textarea>'
    +'<div class="flex" style="gap:7px;margin-top:6px;align-items:center">'
    +'<button class="btn pri sm" onclick="copyQuoteCode()">复制回传码</button>'
    +'<span class="sm mut" id="qcodeTip"></span></div></div>';
  setFlash('g','<b>已收到 '+esc(company)+' 的报价</b>（'+q.status+'），'
    +(hasItems?'合价 '+fmt(Math.round(sum))+' 元 / ':'')
    +'到手总价 '+fmt(Math.round(landed(q)))+' 元。去「询价比价」查看逐项对比。');
  refreshBadges();
}
function copyQuoteCode(){
  const el=$('qcode'),tip=$('qcodeTip');if(!el)return;
  el.select();el.setSelectionRange(0,el.value.length);
  let ok=false;
  try{ok=document.execCommand('copy');}catch(e){}
  if(!ok&&navigator.clipboard)navigator.clipboard.writeText(el.value).then(function(){},function(){});
  if(tip)tip.innerHTML='<b style="color:var(--ok)">已复制</b>，粘贴到微信发给研发即可。';
}
function fillQ(q){
  const d=DM(s1Demand);
  const items=(d&&d.items)?(d.items||[]).map(function(it,i){
    const el=$('qi_'+i),raw=el?String(el.value).trim():'';
    return {i:i,price:raw===''?null:(parseFloat(raw)||0)};
  }):[];
  const sum=items.length?items.reduce(function(a,b){return a+((Number(b.price)||0)*itemQty(d,b.i));},0)
                        :(num($('q_total')?$('q_total').value:'')||0);
  Object.assign(q,{
    company:$('q_company').value.trim(),contact:$('q_contact').value.trim(),
    items:items.length?items:q.items,total:Math.round(sum),
    taxIncluded:$('q_tax').value==='1',taxRate:num($('q_taxrate').value)||13,
    freightIncluded:$('q_freight').value==='1',freight:num($('q_freightfee').value)||0,
    installIncluded:$('q_install').value==='1',installFee:num($('q_installfee').value)||0,
    designIncluded:$('q_design').value==='1',designFee:num($('q_designfee').value)||0,
    trialIncluded:$('q_trial').value==='1',trialFee:num($('q_trialfee').value)||0,
    leadDays:num($('q_lead').value)||0,warranty:num($('q_warranty').value)||12,
    validDays:num($('q_valid').value)||30,deviation:$('q_dev').value.trim(),
    note:$('q_note').value.trim(),at:TODAY+' 12:00'
  });
  setFlash('o','该手机号已有报价，已更新为本次提交内容。');
  refreshBadges();
}

/* ======================= 初始化 ======================= */
document.querySelectorAll('#nav a').forEach(a=>{a.onclick=()=>go(a.dataset.p);});
/* 二维码扫出来的链接形如 …?p=s1&d=D-2026-014&x=… → 直接进入供应商扫码视图
   带 x 时用链接自带的需求数据渲染（原型无后端，手机端取不到研发本地数据） */
const UP=urlParams();
if(UP.p==='s1'||UP.p==='scan')enterScan(UP.d,UP.x);
else go('list');
